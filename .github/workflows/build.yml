name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read ncnn revision
        id: ncnn-revision
        run: echo "sha=$(git -C third_party/ncnn rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore CMake build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-seedvr2-cmake-${{ steps.ncnn-revision.outputs.sha }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/build.yml') }}

      - name: Configure
        run: >-
          cmake -S . -B build
          -DSEEDVR2_ENABLE_VULKAN=OFF
          -DNCNN_RUNTIME_CPU=OFF
          -DNCNN_SSE2=OFF
          -DNCNN_AVX=OFF
          -DNCNN_OPENMP=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: CLI smoke test
        run: |
          ./build/seedvr2-ncnn --help | grep -Fq 'Usage: seedvr2-ncnn'

  linux-runtime-package:
    # Build on the oldest supported glibc baseline for portable archives.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan build prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvulkan-dev nasm

      - name: Build LGPL FFmpeg runtime
        run: packaging/linux/build_ffmpeg_lgpl.sh --prefix "$RUNNER_TEMP/ffmpeg-prefix" --jobs 2

      - name: Configure Vulkan release build
        run: >-
          cmake -S . -B build-release
          -DSEEDVR2_ENABLE_VULKAN=ON
          -DSEEDVR2_ENABLE_FFMPEG=ON
          -DNCNN_OPENMP=ON
          -DSEEDVR2_FFMPEG_INCLUDE_DIR=$RUNNER_TEMP/ffmpeg-prefix/include
          -DSEEDVR2_FFMPEG_AVFORMAT_LIBRARY=$RUNNER_TEMP/ffmpeg-prefix/lib/libavformat.so
          -DSEEDVR2_FFMPEG_AVCODEC_LIBRARY=$RUNNER_TEMP/ffmpeg-prefix/lib/libavcodec.so
          -DSEEDVR2_FFMPEG_AVUTIL_LIBRARY=$RUNNER_TEMP/ffmpeg-prefix/lib/libavutil.so
          -DSEEDVR2_FFMPEG_SWSCALE_LIBRARY=$RUNNER_TEMP/ffmpeg-prefix/lib/libswscale.so
          -DCMAKE_SKIP_RPATH=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Vulkan release executable
        run: cmake --build build-release --target seedvr2-ncnn --parallel 2

      - name: Stage Linux runtime archive
        run: >-
          packaging/linux/package_runtime.sh
          --binary "$GITHUB_WORKSPACE/build-release/seedvr2-ncnn"
          --ffmpeg-prefix "$RUNNER_TEMP/ffmpeg-prefix"
          --ffmpeg-source "$RUNNER_TEMP/ffmpeg-8.1.2.tar.xz"
          --output "$RUNNER_TEMP/seedvr2-release"

      - name: Validate staged archive contract
        env:
          SEEDVR2_PACKAGE_TEST_BINARY: ${{ github.workspace }}/build-release/seedvr2-ncnn
          SEEDVR2_PACKAGE_TEST_FFMPEG_PREFIX: ${{ runner.temp }}/ffmpeg-prefix
          SEEDVR2_PACKAGE_TEST_FFMPEG_SOURCE: ${{ runner.temp }}/ffmpeg-8.1.2.tar.xz
        run: ./packaging/linux/validate_runtime_package.sh --release-smoke
