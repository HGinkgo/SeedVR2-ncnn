name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read ncnn revision
        id: ncnn-revision
        run: echo "sha=$(git -C third_party/ncnn rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore CMake build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-seedvr2-cmake-${{ steps.ncnn-revision.outputs.sha }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/build.yml') }}

      - name: Configure
        run: >-
          cmake -S . -B build
          -DSEEDVR2_ENABLE_VULKAN=OFF
          -DSEEDVR2_BUILD_TESTS=OFF
          -DNCNN_RUNTIME_CPU=OFF
          -DNCNN_SSE2=OFF
          -DNCNN_AVX=OFF
          -DNCNN_OPENMP=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Smoke test
        run: bash tests/smoke.sh ./build/seedvr2-ncnn

  linux-runtime-package:
    # Build on the oldest supported glibc baseline for portable archives.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan build prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvulkan-dev nasm

      - name: Build LGPL FFmpeg runtime
        run: packaging/linux/build_ffmpeg_lgpl.sh --prefix "$RUNNER_TEMP/ffmpeg-prefix" --jobs 2

      - name: Configure Vulkan release build
        run: >-
          cmake -S . -B build-release
          -DSEEDVR2_ENABLE_VULKAN=ON
          -DSEEDVR2_ENABLE_FFMPEG=ON
          -DSEEDVR2_BUILD_TESTS=ON
          -DNCNN_OPENMP=ON
          -DSEEDVR2_FFMPEG_INCLUDE_DIR=$RUNNER_TEMP/ffmpeg-prefix/include
          -DSEEDVR2_FFMPEG_AVFORMAT_LIBRARY=$RUNNER_TEMP/ffmpeg-prefix/lib/libavformat.so
          -DSEEDVR2_FFMPEG_AVCODEC_LIBRARY=$RUNNER_TEMP/ffmpeg-prefix/lib/libavcodec.so
          -DSEEDVR2_FFMPEG_AVUTIL_LIBRARY=$RUNNER_TEMP/ffmpeg-prefix/lib/libavutil.so
          -DSEEDVR2_FFMPEG_SWSCALE_LIBRARY=$RUNNER_TEMP/ffmpeg-prefix/lib/libswscale.so
          -DCMAKE_SKIP_RPATH=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Vulkan release executable
        run: cmake --build build-release --target seedvr2-ncnn seedvr2-cli-test seedvr2-video-io-test --parallel 2

      - name: Run release build checks
        run: ctest --test-dir build-release --output-on-failure -R 'seedvr2-(cli|video-io)-test'

      - name: Stage Linux runtime archive
        run: >-
          packaging/linux/package_runtime.sh
          --binary "$GITHUB_WORKSPACE/build-release/seedvr2-ncnn"
          --ffmpeg-prefix "$RUNNER_TEMP/ffmpeg-prefix"
          --ffmpeg-source "$RUNNER_TEMP/ffmpeg-8.1.2.tar.xz"
          --output "$RUNNER_TEMP/seedvr2-release"

      - name: Validate staged archive contract
        env:
          SEEDVR2_PACKAGE_TEST_BINARY: ${{ github.workspace }}/build-release/seedvr2-ncnn
          SEEDVR2_PACKAGE_TEST_FFMPEG_PREFIX: ${{ runner.temp }}/ffmpeg-prefix
          SEEDVR2_PACKAGE_TEST_FFMPEG_SOURCE: ${{ runner.temp }}/ffmpeg-8.1.2.tar.xz
        run: ./tests/manual/package/test_linux_runtime_package.sh --release-smoke

      - name: Upload Linux runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: SeedVR2-ncnn-linux-x86_64
          path: ${{ runner.temp }}/seedvr2-release/SeedVR2-ncnn-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-runtime-package:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # MSYS2 tooling expects the line endings stored in the repository, so
      # disable CRLF conversion before the checkout runs.
      - name: Keep repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Windows package is built entirely with the MSYS2 UCRT64 MinGW
      # toolchain: FFmpeg, ncnn and the runtime DLLs all share the MinGW ABI.
      # Mixing MSVC and MinGW artefacts is not supported.
      # ncnn compiles the glslang submodule it vendors, so no system glslang
      # package is needed here.
      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader

      # setup-msys2 only exposes the MSYS2 userland on PATH; the UCRT64 MinGW
      # binaries live under a location reported by the action.
      - name: Put the UCRT64 toolchain on PATH
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          if (-not $env:MSYS2_LOCATION) {
            Write-Error 'setup-msys2 did not report msys2-location'; exit 1
          }
          $bin = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          if (-not (Test-Path (Join-Path $bin 'gcc.exe'))) {
            Write-Error "UCRT64 gcc is missing under: $bin"; exit 1
          }
          Write-Host "ucrt64 bin: $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Fail loudly rather than silently building with a foreign toolchain.
      - name: Verify MinGW toolchain resolution
        shell: pwsh
        run: |
          $machine = (gcc -dumpmachine).Trim()
          Write-Host "gcc -dumpmachine: $machine"
          if ($machine -ne 'x86_64-w64-mingw32') {
            Write-Error "expected the UCRT64 MinGW compiler, resolved to: $machine"; exit 1
          }

      - name: Build LGPL FFmpeg runtime
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          .\packaging\windows\build_ffmpeg_lgpl.ps1 `
            -Prefix "$env:RUNNER_TEMP\ffmpeg-prefix" `
            -SourceTarball "$env:RUNNER_TEMP\ffmpeg-8.1.2.tar.xz" `
            -Msys2Root $env:MSYS2_LOCATION `
            -Jobs 2

      - name: Add the FFmpeg runtime to PATH
        shell: pwsh
        run: |
          "$env:RUNNER_TEMP\ffmpeg-prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure Vulkan release build
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP\ffmpeg-prefix"
          cmake -S . -B build-release -G Ninja `
            -DSEEDVR2_ENABLE_VULKAN=ON `
            -DSEEDVR2_ENABLE_FFMPEG=ON `
            -DSEEDVR2_BUILD_TESTS=ON `
            -DNCNN_OPENMP=ON `
            -DSEEDVR2_FFMPEG_INCLUDE_DIR="$prefix\include" `
            -DSEEDVR2_FFMPEG_AVFORMAT_LIBRARY="$prefix\lib\libavformat.dll.a" `
            -DSEEDVR2_FFMPEG_AVCODEC_LIBRARY="$prefix\lib\libavcodec.dll.a" `
            -DSEEDVR2_FFMPEG_AVUTIL_LIBRARY="$prefix\lib\libavutil.dll.a" `
            -DSEEDVR2_FFMPEG_SWSCALE_LIBRARY="$prefix\lib\libswscale.dll.a" `
            -DCMAKE_SKIP_RPATH=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc.exe `
            -DCMAKE_CXX_COMPILER=g++.exe

      - name: Build Vulkan release executable
        shell: pwsh
        run: |
          cmake --build build-release --target seedvr2-ncnn seedvr2-cli-test seedvr2-video-io-test --parallel 2

      - name: Run release build checks
        shell: pwsh
        run: |
          ctest --test-dir build-release --output-on-failure -R 'seedvr2-(cli|video-io)-test'

      - name: Stage Windows runtime archive
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          .\packaging\windows\package_runtime.ps1 `
            -Binary "$env:GITHUB_WORKSPACE\build-release\seedvr2-ncnn.exe" `
            -FfmpegPrefix "$env:RUNNER_TEMP\ffmpeg-prefix" `
            -FfmpegSource "$env:RUNNER_TEMP\ffmpeg-8.1.2.tar.xz" `
            -Msys2Root $env:MSYS2_LOCATION `
            -Output "$env:RUNNER_TEMP\seedvr2-release"

      - name: Validate staged archive contract
        shell: pwsh
        run: |
          .\tests\manual\package\test_windows_runtime_package.ps1 `
            -PackageDir "$env:RUNNER_TEMP\seedvr2-release\SeedVR2-ncnn-windows-x86_64" `
            -Archive "$env:RUNNER_TEMP\seedvr2-release\SeedVR2-ncnn-windows-x86_64.zip"

      - name: Upload Windows runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: SeedVR2-ncnn-windows-x86_64
          path: ${{ runner.temp }}/seedvr2-release/SeedVR2-ncnn-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7
